name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: cargo fmt / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (builds the Rust extension)
        run: pip install -v .[test]
      - run: pytest tests -v

  wheels:
    name: wheels (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, smoke: true }
          - { name: linux-aarch64, runner: ubuntu-latest, target: aarch64, smoke: false }
          # No Intel macOS runners since macos-13 was retired; cross-compile from arm64.
          - { name: macos-x86_64, runner: macos-14, target: x86_64, smoke: false }
          - { name: macos-arm64, runner: macos-14, target: aarch64, smoke: true }
          - { name: windows-x64, runner: windows-latest, target: x64, smoke: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # abi3-py39: one wheel per platform covers CPython 3.9+
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: auto
      - name: Smoke-import built wheel
        if: matrix.platform.smoke
        shell: bash
        run: |
          pip install dist/*.whl numpy
          python -c "import dijkstra3d_sparse as ds; import numpy as np; \
            d, p = ds.dijkstra_field(np.array([[0,0,0],[1,0,0]], dtype=np.int32), 0); \
            assert d.tolist() == [0.0, 1.0], d"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist

  wasm:
    name: wasm wheel (pyodide ${{ env.PYODIDE_VERSION }})
    runs-on: ubuntu-latest
    env:
      PYODIDE_VERSION: "314.0.5"
    steps:
      - uses: actions/checkout@v4
      # Pyodide 314.x is CPython 3.14; pyodide-build must run on a matching host.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pyodide-build "maturin>=1.16"

      # The pinned cross-build environment is the single source of truth for
      # every toolchain version used below (and by scripts/build-wasm.sh).
      - name: Read Pyodide toolchain config
        id: pyodide
        run: |
          pyodide xbuildenv install "$PYODIDE_VERSION"
          echo "emscripten_version=$(pyodide config get emscripten_version)" >> "$GITHUB_OUTPUT"

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.pyodide.outputs.emscripten_version }}
          # Caching an emsdk used for published wheels risks a stale toolchain.
          no-cache: true

      - name: Build the wasm wheel
        run: ./scripts/build-wasm.sh

      # Proves the wheel actually loads and runs under the target Pyodide,
      # which a tag check alone would not.
      - name: Run the test suite inside Pyodide
        run: |
          pyodide venv .venv-pyodide
          .venv-pyodide/bin/pip install --upgrade "pip>=26.1.1"
          .venv-pyodide/bin/pip install numpy scipy pytest
          .venv-pyodide/bin/pip install dijkstra3d-sparse \
            --no-index --no-deps --find-links dist
          .venv-pyodide/bin/python -m pytest tests -v

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-wasm
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [rust, test, wheels, wasm, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
