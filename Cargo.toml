[package]
name = "dijkstra3d-sparse"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Shortest paths, distance fields and connected components over sparse 3D voxel sets"

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30", features = ["abi3-py39"] }
numpy = "0.30"
rustc-hash = "2"

[profile.release]
lto = "thin"
codegen-units = 1
